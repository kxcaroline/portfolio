# Mypy configuration. CI runs `mypy flask_website run.py build_thumbs.py
# build_stats.py tests` and must come back clean.

[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# Pillow and pytest ship type information; Flask does via its own stubs.
# Anything without stubs fails loudly rather than silently unchecked.

# rcssmin and rjsmin are C extensions without stubs. They are used only by
# build_assets.py, which never runs in production.
[mypy-rcssmin.*]
ignore_missing_imports = True

[mypy-rjsmin.*]
ignore_missing_imports = True
