[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# The repository root on sys.path, so `from flask_website import ...` resolves.
#
# `python -m pytest` adds the working directory automatically and `pytest`
# does not, so without this the suite passed one way and failed the other —
# and CI calls the bare `pytest`. Declaring it here makes both work.
pythonpath = .
